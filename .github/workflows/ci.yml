name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && pip install -e .
      - name: Reason-code mapping coverage gate
        run: python -m decisioning.mapping_check
      - name: Cached notice staleness gate
        run: python scripts/generate_notices.py --check
      - name: Tests
        run: pytest -q
